name: Build and Test

# Builds the OpenSimplex2 CMake project and runs its tests via CTest.
# `enable_testing()` creates the `test` build target which executes all
# tests registered with add_test() in tests/CMakeLists.txt (see
# "Testing With CMake and CTest", CMake documentation).
on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Allows maintainers to trigger a manual run (e.g. to test the pipeline).
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.os }} (${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]

    steps:
      # The project is a plain C application (no Qt), so no Qt installation
      # is required: the CMake project (submodule/CMake/QuasarApp.cmake) only
      # looks qmake up at configure time and continues if it is not found.
      # Linux uses the pre-installed gcc, Windows the MinGW gcc installed
      # from MSYS2 below.

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.build_type }}

      # The test executable links against libpng (find_package(PNG REQUIRED)) and
      # writes test2d/3d/4d.png at runtime.
      - name: Install libpng (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpng-dev

      # The MinGW gcc compiler (mingw-w64-x86_64-gcc) and the MinGW libpng
      # are installed from MSYS2 and CMake is pointed at the msys2 mingw64
      # root (see the Windows configure step).
      - name: Install MinGW gcc and libpng (Windows)
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-libpng
          suppress-deprecation-warnings: msystem-mingw64

      # setup-msys2 only adds the MSYS2 root to the Windows PATH, so the gcc
      # compiler (the configure step) and the test executable (libpng16-16.dll
      # and libz-1.dll at runtime) would not be found and the tests would
      # fail with 0xc0000135 (STATUS_DLL_NOT_FOUND). Add the mingw64 bin
      # directory to the PATH for the build/test steps.
      - name: Add MSYS2 mingw64 bin to PATH (Windows)
        if: runner.os == 'Windows'
        run: |
          Add-Content "$env:GITHUB_PATH" "${{ steps.msys2.outputs.msys2-location }}/mingw64/bin"

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -B ${{ github.workspace }}/build
          -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_PREFIX_PATH=${{ steps.msys2.outputs.msys2-location }}/mingw64
          -S ${{ github.workspace }}

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: >
          cmake -B ${{ github.workspace }}/build
          -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -S ${{ github.workspace }}

      - name: Build
        run: cmake --build ${{ github.workspace }}/build --config ${{ matrix.build_type }} --parallel 4

      - name: ccache statistics
        run: ccache -s

      # Runs the `test` build target: it invokes CTest, which executes every
      # test registered in tests/CMakeLists.txt (test_noise2/3/4).
      - name: Run Tests
        run: cmake --build ${{ github.workspace }}/build --target test
