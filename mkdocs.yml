# OpenSimplex2 documentation site (GitHub Pages)
#
# Built with MkDocs + the Material theme. Before `mkdocs build` runs,
# the "Deploy Documentation (GitHub Pages)" workflow copies the root
# README.md to docs/index.md (the site home page) and generates the
# Doxygen HTML output into docs/api/, so the API section of the site
# is served from /api/.

site_name: OpenSimplex2
site_description: The most fast implementation of the OpenSimplex noise (2D, 3D and 4D) in C
site_url: https://quasarapp.github.io/OpenSimplex2/

repo_name: QuasarApp/OpenSimplex2
repo_url: https://github.com/QuasarApp/OpenSimplex2
edit_uri: https://github.com/QuasarApp/OpenSimplex2/edit/main/

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      # Teal brand palette (intentionally different from the upstream
      # documentation theme). These entries set the data-md-color-* page
      # attributes (scheme switching / persistence), but Material ships
      # no prebuilt rules for custom hex values, so the actual CSS
      # variable overrides live in docs/overrides/main.css (attached via
      # extra_css). Deep teal (#0e6b64) top bar, teal (#0d7d70) links.
      primary: "#0e6b64"
      accent: "#0d7d70"
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - scheme: slate
      # Same teal top bar on the slate neutrals, light teal (#6fd0c2)
      # links for contrast on the dark background.
      primary: "#0e6b64"
      accent: "#6fd0c2"
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc

# Material for MkDocs only ships prebuilt palette rules for the named
# Material colors, so the teal palette is applied through this extra
# stylesheet (loaded after the theme CSS, see the file header in
# docs/overrides/main.css for the color choices).
extra_css:
  - overrides/main.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  # index.md is copied from the root README.md by the documentation
  # workflow before the MkDocs build, so the README stays the single
  # source of truth and the generated copy is not committed.
  - Home: index.md
  # api/index.html is the static Doxygen index generated into docs/api/
  # by the documentation workflow before the MkDocs build.
  - API: api/index.html
